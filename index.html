<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>摘帽咯 v0.1 工作台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">特殊机会投资研究工具 · v0.1</p>
        <h1>摘帽咯 ST/*ST 摘星摘帽筛选工作台</h1>
        <p class="subtitle">
          以 Excel 为临时数据库，把规则映射、公告证据、四联判断、市场行为和历史相似案例串成一条可复核的研究流程。
        </p>
      </div>
      <div class="topbar-actions">
        <button class="ghost-button" id="printReportBtn" type="button">导出当前报告</button>
        <a class="primary-button" href="#single-stock">查看单股诊断</a>
      </div>
    </header>

    <main class="shell">
      <section class="panel upload-panel" aria-labelledby="uploadTitle">
        <div>
          <h2 id="uploadTitle">数据库入口</h2>
          <p>
            v0.1 先读取本地台账中的 2026-06-05 ST/*ST 股票池。上传入口保留给后续 Excel 自动解析，目前可直接试用 JSON/CSV。
          </p>
        </div>
        <label class="upload-box">
          <input id="fileInput" type="file" accept=".xlsx,.xls,.csv,.json" />
          <span>上传股票池 Excel / CSV / JSON</span>
          <small id="uploadStatus">当前使用：A股ST股统计_原始快照_2026-06-05.xlsx 抽取数据</small>
        </label>
      </section>

      <section class="kpi-grid" id="kpiGrid" aria-label="股票池概览"></section>

      <section class="workflow-band" aria-labelledby="workflowTitle">
        <div class="section-heading">
          <p class="eyebrow">筛选逻辑</p>
          <h2 id="workflowTitle">从全市场 ST 池到高潜力候选</h2>
        </div>
        <div class="funnel" id="funnel"></div>
      </section>

      <section class="work-grid">
        <section class="panel table-panel" aria-labelledby="poolTitle">
          <div class="section-heading row-heading">
            <div>
              <p class="eyebrow">全池筛选</p>
              <h2 id="poolTitle">当前 ST/*ST 股票池</h2>
            </div>
            <div class="filters">
              <input id="searchInput" type="search" placeholder="输入代码或简称" />
              <select id="poolFilter">
                <option value="all">全部分类</option>
                <option value="A">A 类重点</option>
                <option value="B">B 类观察</option>
                <option value="C">C 类谨慎</option>
                <option value="D">D 类排除</option>
              </select>
              <select id="strategyFilter">
                <option value="all">全部策略标签</option>
                <option value="财务硬指标修复">财务硬指标修复</option>
                <option value="司法重整节点">司法重整节点</option>
                <option value="合规整改闭环">合规整改闭环</option>
                <option value="重大违法风险观察">重大违法风险观察</option>
              </select>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>代码</th>
                  <th>简称</th>
                  <th>分层</th>
                  <th>规则类型</th>
                  <th>策略标签</th>
                  <th>初筛</th>
                </tr>
              </thead>
              <tbody id="poolTable"></tbody>
            </table>
          </div>
        </section>

        <section class="panel detail-panel" id="single-stock" aria-labelledby="detailTitle">
          <div class="section-heading row-heading">
            <div>
              <p class="eyebrow">单股诊断</p>
              <h2 id="detailTitle">样本研究卡</h2>
            </div>
            <select id="stockSelect" aria-label="选择股票"></select>
          </div>
          <div id="detailContent"></div>
        </section>
      </section>

      <section class="panel report-panel" aria-labelledby="reportTitle">
        <div class="section-heading row-heading">
          <div>
            <p class="eyebrow">PDF 报告预览</p>
            <h2 id="reportTitle">单股研究报告结构</h2>
          </div>
          <button class="primary-button" id="printReportBtnBottom" type="button">导出 PDF</button>
        </div>
        <div id="reportPreview" class="report-preview"></div>
      </section>
    </main>

    <script src="./data/current_pool.js?v=20260609b"></script>
    <script src="./main.js?v=20260609b"></script>
  </body>
</html>
